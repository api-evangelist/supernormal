aid: supernormal
name: supernormal
description: >-
  Supernormal is an AI meeting assistant and AI-agents platform (backed by Balderton Capital
  and EQT Ventures) that joins Google Meet, Zoom, and Microsoft Teams calls to capture,
  transcribe, and summarize meetings into shareable notes with action items. Beyond meeting
  notes, Supernormal offers configurable AI voice agents that can host or join calls, run
  surveys and screening interviews, and produce transcripts and structured posts. Its public
  REST API (https://api.supernormal.com/api/v1) exposes the current user, upcoming calendar
  events, meeting posts with notes and transcripts, agents, and agent sessions, authenticated
  with a scoped X-API-TOKEN API key. Supernormal additionally runs an OAuth 2.0 authorization
  server with dynamic client registration and PKCE, and a published, OAuth-protected Model
  Context Protocol (MCP) server so agents can access recordings and projects.
