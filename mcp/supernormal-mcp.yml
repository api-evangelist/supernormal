notes: >-
  Supernormal publishes a remote, OAuth-protected Model Context Protocol server at
  https://api.supernormal.com/mcp. An unauthenticated request returns HTTP 401 with a
  WWW-Authenticate Bearer challenge advertising resource_metadata
  (/.well-known/oauth-protected-resource/mcp), which points at the RFC 8414 authorization
  server. Clients register dynamically (RFC 7591) and complete an authorization-code + PKCE
  flow to obtain a bearer token scoped to recordings/projects. The tool list is not
  enumerable without a token; the tools below are candidate mappings inferred from the public
  REST API operations and the OAuth scopes (recordings/projects).
